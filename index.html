<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Journal — Nurture</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
  color:#123;
}

/* ===== LOGIN BOX ===== */
#loginBox{
  max-width:340px;
  margin:100px auto;
  padding:24px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.12);
}
#loginBox input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ddd;
}
#loginBox button{
  width:100%;
  padding:12px;
  background:#2d7a78;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}
#loginError{color:red}

/* ===== JOURNAL ===== */
#journalWrapper{display:none}

:root{
  --muted:#8aa3a0;
  --primary:#2d7a78;
  --bg:#fffaf0;
  --sheet-bg:#ffffff;
  --pill-radius:14px;
}

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:36px 20px;
}

.sheet{
  width:100%;
  max-width:980px;
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 18px 60px rgba(0,0,0,.08);
}

.header{display:flex;gap:18px;margin-bottom:18px}
.title-main{
  font-family:'Playfair Display',serif;
  font-size:54px;
  margin:0;
  color:#7f9a98;
  letter-spacing:4px;
}
.subtitle{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:20px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}

/* inputs */
.label{font-weight:700;color:var(--muted)}
.pill{
  width:100%;
  padding:14px;
  border-radius:var(--pill-radius);
  border:0;
  margin-bottom:10px;
}
.pill-blue{background:#d6eeeb}
.pill-warm{background:#fbe7be}
.pill-cream{background:#f5f2ec}
.note{min-height:80px}

/* buttons */
.btn{
  background:var(--primary);
  color:#fff;
  border:0;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}
.ghost{
  background:transparent;
  color:var(--primary);
  border:1px solid rgba(45,122,120,.2);
}

/* preview */
.panel{
  background:#fff;
  padding:18px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}
.preview-pill{
  padding:12px;
  border-radius:14px;
  margin-bottom:8px;
}
.preview-blue{background:#d6eeeb}
.preview-warm{background:#fbe7be}
.preview-cream{background:#f5f2ec}
.entries{max-height:240px;overflow:auto}
.entry{padding:10px;border:1px solid #eee;border-radius:10px;margin-bottom:8px}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginBox">
  <h2>Login</h2>

  <form id="loginForm"
    method="POST"
    action="https://script.google.com/macros/s/AKfycbymB01q23Sw43K53iWTEf5Otxp3jEqjt6_3E9XBevIbgnTeZWZgeZA_n1G4qeXcYTjx/exec">

    <input type="hidden" name="action" value="login">
    <input type="hidden" name="passwordHash" id="passwordHash">

    <input name="username" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <p id="loginError"></p>
</div>

<!-- ================= JOURNAL ================= -->
<div id="journalWrapper">
  <div class="page">
    <div class="sheet">

      <div class="header">
        <div>
          <h1 class="title-main">GRATITUDE</h1>
          <div class="subtitle">You Matter — Daily reflection</div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label class="label">Today's Affirmation</label>
          <input id="affirm" class="pill pill-blue">

          <label class="label">3 Good Things</label>
          <input id="good1" class="pill pill-warm">
          <input id="good2" class="pill pill-warm">
          <input id="good3" class="pill pill-warm">

          <label class="label">3 Things You're Grateful For</label>
          <input id="gr1" class="pill pill-cream">
          <input id="gr2" class="pill pill-cream">
          <input id="gr3" class="pill pill-cream">

          <label class="label">Note</label>
          <textarea id="note" class="pill note"></textarea>

          <button id="saveBtn" class="btn">Save Entry</button>
        </div>

        <aside class="panel">
          <div id="pAff" class="preview-pill preview-blue">Affirmation —</div>
          <div id="pGood" class="preview-pill preview-warm">Good —</div>
          <div id="pGr" class="preview-pill preview-cream">Grateful —</div>
          <div class="entries" id="entries"></div>
        </aside>
      </div>

    </div>
  </div>
</div>

<script>
/* ===== PASSWORD HASH ===== */
document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const pw=document.getElementById("password").value;
  const buf=new TextEncoder().encode(pw);
  const hash=await crypto.subtle.digest("SHA-256",buf);
  document.getElementById("passwordHash").value=
    Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  e.target.submit();
});

/* ===== LOGIN RESULT ===== */
const params=new URLSearchParams(location.search);
if(params.get("success")==="1"){
  loginBox.style.display="none";
  journalWrapper.style.display="block";
}
if(params.get("error")==="1"){
  loginError.textContent="Invalid login";
}

/* ===== SIMPLE LOCAL SAVE ===== */
const affirm=document.getElementById("affirm");
const good1=document.getElementById("good1");
const good2=document.getElementById("good2");
const good3=document.getElementById("good3");
const gr1=document.getElementById("gr1");
const gr2=document.getElementById("gr2");
const gr3=document.getElementById("gr3");
const note=document.getElementById("note");

saveBtn.onclick=()=>{
  const data={
    a:affirm.value,
    g:[good1.value,good2.value,good3.value],
    r:[gr1.value,gr2.value,gr3.value],
    n:note.value,
    t:new Date().toLocaleString()
  };
  localStorage.setItem("journal_latest",JSON.stringify(data));
  render();
};

function render(){
  const d=JSON.parse(localStorage.getItem("journal_latest")||"null");
  if(!d)return;
  pAff.textContent="Affirmation — "+(d.a||"");
  pGood.textContent="Good — "+d.g.filter(Boolean).join(" · ");
  pGr.textContent="Grateful — "+d.r.filter(Boolean).join(" · ");
}
render();
</script>

</body>
</html>
