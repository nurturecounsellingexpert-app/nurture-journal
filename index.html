<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gratitude Journal</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
}

/* ===== LOGIN ===== */
#loginBox{
  max-width:360px;
  margin:100px auto;
  padding:28px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}
#loginBox h2{margin-top:0}
#loginBox input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ddd;
}
#loginBox button{
  width:100%;
  padding:12px;
  background:#2d7a78;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}
#loginError{color:#c00;margin-top:8px}

/* ===== JOURNAL VISIBILITY ===== */
#journalWrapper{display:none}

/* ===== JOURNAL UI (UNCHANGED VISUALS) ===== */
:root{
  --primary:#2d7a78;
  --muted:#8aa3a0;
}
.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:32px 16px;
}
.sheet{
  max-width:980px;
  width:100%;
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 18px 60px rgba(0,0,0,.08);
}
.header{
  display:flex;
  align-items:flex-end;
  gap:12px;
}
.title-main{
  font-family:"Playfair Display",serif;
  font-size:56px;
  color:#7f9a98;
  margin:0;
}
.title-small{
  font-size:18px;
  color:var(--muted);
}
.subtitle{
  font-size:13px;
  color:var(--muted);
}
.grid{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:20px;
  margin-top:20px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .title-main{font-size:42px}
}
.label{
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}
.pill{
  width:100%;
  padding:14px 18px;
  border-radius:14px;
  border:0;
  margin-bottom:10px;
}
.pill-blue{background:#d6eeeb}
.pill-warm{background:#fbe7be}
.pill-cream{background:#f3efe6}
.note{min-height:90px}
.two-col{display:flex;gap:14px}
.col{flex:1}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{
  background:var(--primary);
  color:#fff;
  border:0;
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
}
.ghost{
  background:transparent;
  color:var(--primary);
  border:1px solid rgba(45,122,120,.2);
}
.panel{
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}
.preview-pill{
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginBox">
  <h2>Login</h2>

  <form id="loginForm"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbxJhvox0MOAJleXHS6jezMSmOyJztgMaI4yc1bazoe3bAAesFIlJ46D1UvDRzdce3G1/exec">

    <input type="hidden" name="action" value="login">
    <input type="hidden" name="passwordHash" id="passwordHash">

    <input name="username" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <div id="loginError"></div>
</div>

<!-- ================= JOURNAL ================= -->
<div id="journalWrapper">
  <div class="page">
    <div class="sheet">

      <div class="header">
        <h1 class="title-main">GRATITUDE</h1>
        <div>
          <div class="title-small">journal</div>
          <div class="subtitle">You Matter — Daily reflection</div>
        </div>
      </div>

      <div class="grid">

        <!-- LEFT -->
        <div>
          <label class="label">Today's Affirmation</label>
          <input class="pill pill-blue" placeholder="I am...">

          <label class="label">3 Good Things Happened Today</label>
          <input class="pill pill-warm" placeholder="1">
          <input class="pill pill-warm" placeholder="2">
          <input class="pill pill-warm" placeholder="3">

          <label class="label">3 Things You are Grateful for Today</label>
          <input class="pill pill-cream" placeholder="1">
          <input class="pill pill-cream" placeholder="2">
          <input class="pill pill-cream" placeholder="3">

          <div class="two-col">
            <div class="col">
              <label class="label">Things To Do</label>
              <input class="pill pill-blue" placeholder="1">
              <input class="pill pill-blue" placeholder="2">
              <input class="pill pill-blue" placeholder="3">
            </div>
            <div class="col">
              <label class="label">Tomorrow I Look Forward to</label>
              <input class="pill pill-warm" placeholder="1">
              <input class="pill pill-warm" placeholder="2">
              <input class="pill pill-warm" placeholder="3">
            </div>
          </div>

          <label class="label">Note / Reminder</label>
          <textarea class="pill note" placeholder="Write any note..."></textarea>

          <div class="actions">
            <button class="btn">Save Entry</button>
            <button class="ghost">New</button>
          </div>
        </div>

        <!-- RIGHT -->
        <aside class="panel">
          <strong style="color:var(--muted)">Preview</strong>
          <div class="preview-pill pill-blue">Affirmation —</div>
          <div class="preview-pill pill-warm">Good things —</div>
          <div class="preview-pill pill-cream">Grateful for —</div>
          <div class="preview-pill pill-blue">Things To Do —</div>
          <div class="preview-pill pill-warm">Tomorrow —</div>
        </aside>

      </div>
    </div>
  </div>
</div>

<script>
/* ===== PASSWORD HASH ===== */
document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const pw = document.getElementById("password").value;
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  document.getElementById("passwordHash").value =
    Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  e.target.submit();
});

/* ===== LOGIN RESULT ===== */
const params = new URLSearchParams(location.search);
if(params.get("success")==="1"){
  loginBox.style.display="none";
  journalWrapper.style.display="block";
}
if(params.get("error")==="1"){
  loginError.textContent="Invalid username or password";
}
</script>

</body>
</html>
