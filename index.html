<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gratitude Journal — Nurture</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<!-- ================= ORIGINAL CSS (UNCHANGED) ================= -->
<style>
:root{
  --muted:#8aa3a0;
  --primary:#2d7a78;
  --bg:#fffaf0;
  --sheet-bg:#ffffff;
  --pill-radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Quicksand,system-ui;background:var(--bg);color:#123}

/* PAGE */
.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:36px 20px;
}
.sheet{
  width:100%;
  max-width:980px;
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 18px 60px rgba(6,12,20,0.08);
}

/* LOGIN */
#loginBox{
  max-width:360px;
  margin:120px auto;
  padding:24px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}
#loginBox input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ddd
}
#loginBox button{
  width:100%;
  padding:12px;
  background:#2d7a78;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

/* HEADER */
.header{display:flex;gap:18px;margin-bottom:18px}
.title-main{
  font-family:'Playfair Display',serif;
  font-size:64px;
  color:#7f9a98;
  letter-spacing:4px;
}
.subtitle{color:var(--muted)}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 360px;gap:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.label{font-weight:700;color:var(--muted);margin-bottom:8px}
.pill{
  width:100%;
  padding:14px 18px;
  border-radius:var(--pill-radius);
  border:0;
  font-size:16px;
}
.pill-blue{background:#e7f3f2}
.pill-warm{background:#fbe7be}
.pill-cream{background:#f5f2ec}

.preview-pill{
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
  background:#e7f3f2;
}

.panel{
  background:#fafafa;
  padding:18px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
}
.entries{margin-top:12px}
.entry{
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  font-size:13px;
}

.actions{display:flex;gap:10px;margin-top:12px}
.btn{
  padding:10px 14px;
  border-radius:12px;
  border:0;
  background:var(--primary);
  color:white;
  font-weight:700;
  cursor:pointer;
}
.ghost{
  background:transparent;
  color:var(--primary);
  border:1px solid rgba(45,122,120,0.2);
}
.note{min-height:90px}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginBox">
  <h2>Login</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="err" style="color:red"></p>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
<div class="page">
<div class="sheet">

  <div class="header">
    <div>
      <div class="title-main">GRATITUDE</div>
      <div class="subtitle">journal · You Matter</div>
    </div>
  </div>

  <div class="grid">
    <div>
      <label class="label">Today's Affirmation</label>
      <input id="affirm" class="pill pill-blue">

      <label class="label">3 Good Things</label>
      <input id="g1" class="pill pill-warm">
      <input id="g2" class="pill pill-warm">
      <input id="g3" class="pill pill-warm">

      <label class="label">3 Things You're Grateful For</label>
      <input id="gr1" class="pill pill-cream">
      <input id="gr2" class="pill pill-cream">
      <input id="gr3" class="pill pill-cream">

      <label class="label">Things To Do</label>
      <input id="t1" class="pill pill-blue">
      <input id="t2" class="pill pill-blue">
      <input id="t3" class="pill pill-blue">

      <label class="label">Tomorrow I Look Forward To</label>
      <input id="to1" class="pill pill-warm">
      <input id="to2" class="pill pill-warm">
      <input id="to3" class="pill pill-warm">

      <label class="label">Note</label>
      <textarea id="note" class="pill note"></textarea>

      <div class="actions">
        <button class="btn" onclick="saveEntry()">Save Entry</button>
        <button class="ghost" onclick="clearForm()">New</button>
      </div>
    </div>

    <aside class="panel">
      <strong style="color:var(--muted)">Preview</strong>
      <div id="preview" class="preview-pill"></div>
      <div class="entries" id="entryList"></div>
    </aside>
  </div>

</div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwS40hl7YGxsSLjGnY74PfeiKvP8TATXaVfrJVEpHK5nYhC8W6RQHHsKpPc_Qgqiehz/exec";

/* SESSION */
if(localStorage.getItem("loggedIn")==="1"){
  loginBox.style.display="none";
  app.style.display="block";
  loadEntries();
}

/* LOGIN */
async function login(){
  const enc=new TextEncoder().encode(password.value);
  const hash=await crypto.subtle.digest("SHA-256",enc);
  const passwordHash=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");

  const res=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({
      action:"login",
      username:username.value,
      passwordHash
    })
  });

  const data=await res.json();
  if(data.ok){
    localStorage.setItem("loggedIn","1");
    loginBox.style.display="none";
    app.style.display="block";
    loadEntries();
  }else{
    err.innerText="Invalid login";
  }
}

/* JOURNAL LOGIC (UNCHANGED) */
const getAll=()=>JSON.parse(localStorage.getItem("entries")||"[]");
const saveAll=d=>localStorage.setItem("entries",JSON.stringify(d));

function saveEntry(){
  const e={
    time:new Date().toLocaleString(),
    affirmation:affirm.value,
    good:[g1.value,g2.value,g3.value],
    grateful:[gr1.value,gr2.value,gr3.value],
    todo:[t1.value,t2.value,t3.value],
    tomorrow:[to1.value,to2.value,to3.value],
    note:note.value
  };
  const d=getAll();d.unshift(e);saveAll(d);
  clearForm();loadEntries();
}

function loadEntries(){
  entryList.innerHTML="";
  const d=getAll();
  if(d[0]) preview.textContent=d[0].affirmation||"—";
  d.forEach((e,i)=>{
    entryList.innerHTML+=`
    <div class="entry">
      <small>${e.time}</small><br>
      ${e.affirmation || ""}
    </div>`;
  });
}

function clearForm(){
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}
</script>

</body>
</html>
