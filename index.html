<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Journal</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
}

/* ===== LOGIN BOX ===== */
#loginBox{
  max-width:340px;
  margin:100px auto;
  padding:24px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.12);
}
#loginBox input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ddd;
}
#loginBox button{
  width:100%;
  padding:12px;
  background:#2d7a78;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

/* ===== JOURNAL WRAPPER ===== */
#journalWrapper{
  display:none; /* IMPORTANT */
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginBox">
  <h2>Login</h2>

  <form id="loginForm"
        method="POST"
        action="https://script.google.com/macros/s/YOUR_DEPLOYED_SCRIPT_URL/exec">

    <input type="hidden" name="action" value="login">
    <input type="hidden" name="passwordHash" id="passwordHash">

    <input name="username" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <p id="loginError" style="color:red"></p>
</div>

<!-- ================= JOURNAL (YOUR ORIGINAL UI) ================= -->
<div id="journalWrapper">

  <!-- 🔴 PASTE YOUR ORIGINAL JOURNAL HTML HERE 🔴 -->
  <!-- NOTHING inside this div should be changed -->

</div>

<script>
/* ===== HASH PASSWORD BEFORE SUBMIT ===== */
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const pw = document.getElementById("password").value;
  const buf = new TextEncoder().encode(pw);
  const hash = await crypto.subtle.digest("SHA-256", buf);

  document.getElementById("passwordHash").value =
    Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2,"0"))
      .join("");

  e.target.submit();
});

/* ===== HANDLE LOGIN RESULT ===== */
const params = new URLSearchParams(window.location.search);

if(params.get("success")==="1"){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("journalWrapper").style.display="block";
}

if(params.get("error")==="1"){
  document.getElementById("loginError").innerText="Invalid login";
}
</script>

</body>
</html>
