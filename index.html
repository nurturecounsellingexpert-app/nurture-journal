<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gratitude Journal — Nurture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fff7ea;
}
.wrapper{
  max-width:1100px;
  margin:40px auto;
  background:#fff;
  border-radius:20px;
  padding:30px;
  display:grid;
  grid-template-columns: 1fr 320px;
  gap:30px;
}
h1{
  font-weight:700;
  letter-spacing:1px;
}
label{
  font-weight:600;
  color:#678;
  margin-top:14px;
  display:block;
}
input,textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:0;
  background:#f3f3f3;
  margin-bottom:10px;
}
.group-yellow input{ background:#fde9be; }
.group-green input{ background:#dbf1ed; }
.note{ min-height:90px; resize:vertical; }

.row-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
button{
  padding:10px 14px;
  border-radius:20px;
  border:0;
  cursor:pointer;
  font-weight:600;
}
.save{ background:#2d7a78; color:#fff; }
.secondary{ background:#eef; }

.preview{
  background:#fafafa;
  border-radius:16px;
  padding:16px;
}
.preview h3{ margin-top:0; }
.pill{
  padding:10px;
  border-radius:12px;
  margin-bottom:8px;
  font-size:14px;
}
.p-green{ background:#dbf1ed; }
.p-yellow{ background:#fde9be; }
.p-gray{ background:#eee; }

.entries{
  margin-top:20px;
  font-size:13px;
}
.entry{
  background:#f7f7f7;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
.entry small{ color:#777; display:block; }
.entry button{
  font-size:12px;
  margin-right:6px;
}

.footer{
  margin-top:10px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT -->
<div>

<h1>GRATITUDE <span style="font-weight:400;font-size:16px">journal</span></h1>
<p style="color:#9aa">You Matter — Daily reflection</p>

<label>Today's Affirmation</label>
<input id="affirm">

<label>3 Good Things Happened Today</label>
<div class="group-yellow">
  <input id="g1"><input id="g2"><input id="g3">
</div>

<label>3 Things You Are Grateful For</label>
<div class="group-gray">
  <input id="gr1"><input id="gr2"><input id="gr3">
</div>

<div class="row-2">
  <div class="group-green">
    <label>Things To Do</label>
    <input id="t1"><input id="t2"><input id="t3">
  </div>
  <div class="group-yellow">
    <label>Tomorrow I Look Forward To</label>
    <input id="tm1"><input id="tm2"><input id="tm3">
  </div>
</div>

<label>Note / Reminder</label>
<textarea id="note" class="note" placeholder="Write any note or reminder..."></textarea>

<div class="actions">
  <button class="save" onclick="saveEntry()">Save Entry</button>
  <button class="secondary" onclick="newEntry()">New</button>
  <button class="secondary" onclick="exportAll()">Export (.json)</button>
  <button class="secondary" onclick="importData()">Import</button>
</div>

<div class="footer">
Tip: Your entries are stored only on this device. Nothing is uploaded or shared.
</div>

</div>

<!-- RIGHT -->
<div class="preview">

<h3>Preview</h3>
<div class="pill p-green" id="pAff">Affirmation —</div>
<div class="pill p-yellow" id="pGood">Good things —</div>
<div class="pill p-gray" id="pGrat">Grateful for —</div>
<div class="pill p-green" id="pTodo">Things To Do —</div>
<div class="pill p-yellow" id="pTom">Tomorrow —</div>

<hr>

<div style="text-align:right">
  <button class="secondary" onclick="clearAll()">Clear Local</button>
</div>

<div class="entries" id="entries"></div>

</div>
</div>

<script>
const $ = id => document.getElementById(id);

/* LIVE PREVIEW */
document.querySelectorAll("input,textarea").forEach(i=>{
  i.addEventListener("input",()=>{
    $("pAff").innerText = "Affirmation — " + $("affirm").value;
    $("pGood").innerText = "Good things — " + [g1.value,g2.value,g3.value].filter(Boolean).join(", ");
    $("pGrat").innerText = "Grateful for — " + [gr1.value,gr2.value,gr3.value].filter(Boolean).join(", ");
    $("pTodo").innerText = "Things To Do — " + [t1.value,t2.value,t3.value].filter(Boolean).join(", ");
    $("pTom").innerText = "Tomorrow — " + [tm1.value,tm2.value,tm3.value].filter(Boolean).join(", ");
  });
});

/* STORAGE */
function loadAll(){
  return JSON.parse(localStorage.getItem("entries")||"[]");
}
function saveAll(d){
  localStorage.setItem("entries",JSON.stringify(d));
  renderEntries();
}

/* SAVE */
function saveEntry(){
  const entry={
    id:Date.now(),
    time:new Date().toLocaleString(),
    affirm:affirm.value,
    good:[g1.value,g2.value,g3.value],
    grat:[gr1.value,gr2.value,gr3.value],
    todo:[t1.value,t2.value,t3.value],
    tom:[tm1.value,tm2.value,tm3.value],
    note:note.value
  };
  const all=loadAll();
  all.unshift(entry);
  saveAll(all);
  newEntry();
}

/* RENDER LIST */
function renderEntries(){
  const box=$("entries");
  box.innerHTML="";
  loadAll().forEach(e=>{
    const d=document.createElement("div");
    d.className="entry";
    d.innerHTML=`
      <small>${e.time}</small>
      Affirmation: ${e.affirm}<br>
      <button onclick="restore(${e.id})">Restore</button>
      <button onclick="del(${e.id})">Delete</button>
    `;
    box.appendChild(d);
  });
}

/* ACTIONS */
function restore(id){
  const e=loadAll().find(x=>x.id===id);
  if(!e) return;
  affirm.value=e.affirm;
  [g1,g2,g3].forEach((i,n)=>i.value=e.good[n]||"");
  [gr1,gr2,gr3].forEach((i,n)=>i.value=e.grat[n]||"");
  [t1,t2,t3].forEach((i,n)=>i.value=e.todo[n]||"");
  [tm1,tm2,tm3].forEach((i,n)=>i.value=e.tom[n]||"");
  note.value=e.note;
}
function del(id){
  saveAll(loadAll().filter(x=>x.id!==id));
}
function clearAll(){
  if(confirm("Clear all local entries?")){
    localStorage.removeItem("entries");
    renderEntries();
  }
}
function exportAll(){
  const blob=new Blob([JSON.stringify(loadAll(),null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="gratitude-journal.json";
  a.click();
}
function importData(){
  const i=document.createElement("input");
  i.type="file";
  i.onchange=()=>{
    const r=new FileReader();
    r.onload=()=>saveAll(JSON.parse(r.result));
    r.readAsText(i.files[0]);
  };
  i.click();
}
function newEntry(){
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}
renderEntries();
</script>

</body>
</html>
