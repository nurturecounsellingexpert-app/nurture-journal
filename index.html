<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Journal</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
}

/* LOGIN */
#loginBox{
  max-width:360px;
  margin:120px auto;
  padding:24px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}
#loginBox h2{margin-top:0}
#loginBox input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
#loginBox button{
  width:100%;
  padding:10px;
  background:#2d7a78;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

/* JOURNAL */
#app{display:none}
.container{
  max-width:1100px;
  margin:40px auto;
  background:#fff;
  border-radius:18px;
  padding:24px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:24px;
}
h1{margin-top:0}
label{font-weight:700;color:#567}
input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:10px;
  border:1px solid #ddd;
}
textarea{min-height:90px}
.btn{
  padding:8px 14px;
  border:none;
  border-radius:999px;
  background:#2d7a78;
  color:#fff;
  cursor:pointer;
  font-weight:700;
}
.btn.light{
  background:#e7f3f2;
  color:#2d7a78;
}
.preview, .entries{
  background:#f9f9f9;
  border-radius:14px;
  padding:16px;
}
.entry{
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  font-size:13px;
}
.entry small{color:#777}
.footer{
  font-size:12px;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>

  <form method="POST"
    action="https://script.google.com/macros/s/AKfycbxJhvox0MOAJleXHS6jezMSmOyJztgMaI4yc1bazoe3bAAesFIlJ46D1UvDRzdce3G1/exec">

    <input type="hidden" name="action" value="login">
    <input type="hidden" name="passwordHash" id="passwordHash">

    <input name="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button>Login</button>
  </form>
</div>

<!-- APP -->
<div id="app">
  <div class="container">

    <div>
      <h1>Gratitude Journal</h1>

      <label>Today's Affirmation</label>
      <input id="affirm">

      <label>3 Good Things</label>
      <input id="g1"><input id="g2"><input id="g3">

      <label>3 Things You Are Grateful For</label>
      <input id="gr1"><input id="gr2"><input id="gr3">

      <label>Things To Do</label>
      <input id="t1"><input id="t2"><input id="t3">

      <label>Tomorrow I Look Forward To</label>
      <input id="to1"><input id="to2"><input id="to3">

      <label>Note / Reminder</label>
      <textarea id="note"></textarea>

      <button class="btn" onclick="saveEntry()">Save Entry</button>
      <button class="btn light" onclick="clearForm()">New</button>

      <div class="footer">
        Entries are stored only on this device. Nothing is uploaded.
      </div>
    </div>

    <div>
      <div class="preview">
        <b>Preview</b>
        <div id="previewText"></div>
      </div>

      <div class="entries">
        <div>
          <button class="btn light" onclick="exportAll()">Export All</button>
          <button class="btn light" onclick="clearLocal()">Clear Local</button>
        </div>
        <div id="entryList"></div>
      </div>
    </div>

  </div>
</div>

<script>
/* LOGIN HASH */
document.querySelector("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const hash = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(password.value)
  );
  passwordHash.value = [...new Uint8Array(hash)]
    .map(b=>b.toString(16).padStart(2,"0")).join("");
  e.target.submit();
});

/* SHOW LOGIN OR APP */
const p=new URLSearchParams(location.search);
if(p.get("success")==="1"){
  loginBox.style.display="none";
  app.style.display="block";
  loadEntries();
}else{
  loginBox.style.display="block";
}

/* LOCAL STORAGE */
function getAll(){
  return JSON.parse(localStorage.getItem("entries")||"[]");
}
function saveAll(d){
  localStorage.setItem("entries",JSON.stringify(d));
}

/* SAVE */
function saveEntry(){
  const entry={
    time:new Date().toLocaleString(),
    affirmation:affirm.value,
    good:[g1.value,g2.value,g3.value],
    grateful:[gr1.value,gr2.value,gr3.value],
    todo:[t1.value,t2.value,t3.value],
    tomorrow:[to1.value,to2.value,to3.value],
    note:note.value
  };
  const d=getAll(); d.unshift(entry); saveAll(d);
  clearForm(); loadEntries();
}

/* UI */
function clearForm(){
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}
function loadEntries(){
  entryList.innerHTML="";
  getAll().forEach((e,i)=>{
    entryList.innerHTML+=`
      <div class="entry">
        <small>${e.time}</small><br>
        <b>Affirmation:</b> ${e.affirmation || "-"}<br>
        <b>Good:</b> ${e.good.filter(Boolean).join(", ")}<br>
        <b>Grateful:</b> ${e.grateful.filter(Boolean).join(", ")}<br>
        <b>To Do:</b> ${e.todo.filter(Boolean).join(", ")}<br>
        <b>Tomorrow:</b> ${e.tomorrow.filter(Boolean).join(", ")}<br>
        <button class="btn light" onclick="restore(${i})">Restore</button>
        <button class="btn light" onclick="del(${i})">Delete</button>
      </div>`;
  });
}
function restore(i){
  const e=getAll()[i];
  affirm.value=e.affirmation;
}
function del(i){
  const d=getAll(); d.splice(i,1); saveAll(d); loadEntries();
}
function exportAll(){
  const blob=new Blob([JSON.stringify(getAll(),null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="journal.json"; a.click();
}
function clearLocal(){
  if(confirm("Clear all entries?")){
    localStorage.removeItem("entries");
    loadEntries();
  }
}
</script>

</body>
</html>
