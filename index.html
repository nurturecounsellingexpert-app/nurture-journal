<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gratitude Journal — Nurture</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
}

/* LOGIN */
#loginBox{
  max-width:320px;
  margin:80px auto;
  padding:24px;
  background:white;
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
}
#loginBox input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
#loginBox button{
  width:100%;
  padding:10px;
  background:#2d7a78;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

/* JOURNAL */
#journal{
  display:none;
  padding:30px;
  max-width:1000px;
  margin:auto;
}
label{font-weight:700;color:#567;}
input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid #ddd;
}
button.action{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#2d7a78;
  color:white;
  cursor:pointer;
  font-weight:700;
}
.note{min-height:90px}
.footer{margin-top:20px;color:#777;font-size:13px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="loginError" style="color:red;"></p>
</div>

<!-- JOURNAL -->
<div id="journal">

<h1>Gratitude Journal</h1>

<label>Today's Affirmation</label>
<input id="affirm">

<label>3 Good Things</label>
<input id="good1"><input id="good2"><input id="good3">

<label>3 Things You Are Grateful For</label>
<input id="gr1"><input id="gr2"><input id="gr3">

<label>Things To Do</label>
<input id="todo1"><input id="todo2"><input id="todo3">

<label>Tomorrow I Look Forward To</label>
<input id="tom1"><input id="tom2"><input id="tom3">

<label>Note / Reminder</label>
<textarea id="note" class="note"></textarea>

<button class="action" onclick="saveEntry()">Save Entry</button>

<div class="footer">
  Your entries are stored only on this device. Nothing is uploaded.
</div>

</div>

<script>
/* ================= BACKEND ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwekmmy5gb2jv-xSkNqZx17LzI-a08wrlybxZ3qssLV1inIDGsBvGA2-B4-hJxrsdIM/exec";
let currentUser = null;

/* HASH */
async function sha256(text){
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}

/* LOGIN */
async function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const err = document.getElementById("loginError");

  if(!u || !p){
    err.innerText = "Enter username and password";
    return;
  }

  const res = await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      action:"login",
      username:u,
      passwordHash: await sha256(p)
    })
  });

  const data = await res.json();

  if(!data.success){
    err.innerText = "Invalid login";
    return;
  }

  currentUser = u;
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("journal").style.display = "block";
}

/* ================= LOCAL STORAGE (IndexedDB) ================= */
function openDb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("journalDB",1);
    r.onupgradeneeded = e => {
      e.target.result.createObjectStore("entries",{ keyPath:"id" });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e);
  });
}

async function saveLocal(entry){
  const db = await openDb();
  const tx = db.transaction("entries","readwrite");
  tx.objectStore("entries").put(entry);
}

/* ================= SAVE ENTRY ================= */
async function saveEntry(){

  /* CHECK ENTRY LIMIT */
  const r = await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      action:"canAddEntry",
      username: currentUser
    })
  });

  const d = await r.json();

  if(!d.allowed){
    alert("You have reached your entry limit. Please upgrade.");
    return;
  }

  const entry = {
    id: Date.now().toString(),
    createdAt: new Date().toISOString(),
    affirmation: affirm.value,
    good:[good1.value,good2.value,good3.value].filter(Boolean),
    grateful:[gr1.value,gr2.value,gr3.value].filter(Boolean),
    todo:[todo1.value,todo2.value,todo3.value].filter(Boolean),
    tomorrow:[tom1.value,tom2.value,tom3.value].filter(Boolean),
    note: note.value
  };

  if(!Object.values(entry).some(v => Array.isArray(v) ? v.length : v)){
    alert("Add something before saving");
    return;
  }

  await saveLocal(entry);
  alert("Entry saved");
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}
</script>

</body>
</html>
