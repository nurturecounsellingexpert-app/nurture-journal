<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Journal — Nurture</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body
  <h3 style="text-align:center;color:red">
  VERSION FORM-POST LOGIN
</h3>
  {
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
}

/* LOGIN */
#loginBox{
  max-width:320px;
  margin:80px auto;
  padding:24px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.1);
}
#loginBox input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
#loginBox button{
  width:100%;
  padding:10px;
  background:#2d7a78;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

/* JOURNAL */
#journal{
  display:none;
  max-width:900px;
  margin:40px auto;
  padding:24px;
}
label{font-weight:700;color:#567;}
input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid #ddd;
}
.note{min-height:90px}
button.action{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#2d7a78;
  color:white;
  cursor:pointer;
  font-weight:700;
}
.footer{
  margin-top:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>

  <form id="loginForm" method="POST" action="https://script.google.com/macros/s/AKfycbz5JBbl4dOZoXk3w1TbAiAUckrEeKNZny44P3wb0FvYIeVu27biCVjc6w9xbsdBLPcO/exec">
    <input type="hidden" name="action" value="login">
    <input type="hidden" name="passwordHash" id="passwordHash">

    <input name="username" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <p id="loginError" style="color:red;"></p>
</div>

<!-- JOURNAL -->
<div id="journal">

<h1>Gratitude Journal</h1>

<label>Today's Affirmation</label>
<input id="affirm">

<label>3 Good Things</label>
<input id="good1"><input id="good2"><input id="good3">

<label>3 Things You Are Grateful For</label>
<input id="gr1"><input id="gr2"><input id="gr3">

<label>Things To Do</label>
<input id="todo1"><input id="todo2"><input id="todo3">

<label>Tomorrow I Look Forward To</label>
<input id="tom1"><input id="tom2"><input id="tom3">

<label>Note / Reminder</label>
<textarea id="note" class="note"></textarea>

<button class="action" onclick="saveEntry()">Save Entry</button>

<div class="footer">
  Entries are saved only on this device. Nothing is uploaded.
</div>

</div>

<script>
/* ================= PASSWORD HASH BEFORE SUBMIT ================= */
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const pw = document.getElementById("password").value;
  const buf = new TextEncoder().encode(pw);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  document.getElementById("passwordHash").value =
    Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  e.target.submit();
});

/* ================= HANDLE REDIRECT FLAGS ================= */
const params = new URLSearchParams(window.location.search);

if(params.get("success")==="1"){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("journal").style.display="block";
}

if(params.get("error")==="1"){
  document.getElementById("loginError").innerText="Invalid login";
}

/* ================= LOCAL STORAGE (IndexedDB) ================= */
function openDb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("journalDB",1);
    r.onupgradeneeded = e =>
      e.target.result.createObjectStore("entries",{keyPath:"id"});
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e);
  });
}

async function saveLocal(entry){
  const db = await openDb();
  const tx = db.transaction("entries","readwrite");
  tx.objectStore("entries").put(entry);
}

/* ================= SAVE ENTRY ================= */
function saveEntry(){
  const entry = {
    id: Date.now().toString(),
    createdAt: new Date().toISOString(),
    affirmation: affirm.value,
    good:[good1.value,good2.value,good3.value].filter(Boolean),
    grateful:[gr1.value,gr2.value,gr3.value].filter(Boolean),
    todo:[todo1.value,todo2.value,todo3.value].filter(Boolean),
    tomorrow:[tom1.value,tom2.value,tom3.value].filter(Boolean),
    note: note.value
  };

  if(!Object.values(entry).some(v=>Array.isArray(v)?v.length:v)){
    alert("Add something before saving");
    return;
  }

  saveLocal(entry);
  alert("Entry saved");
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}
</script>

</body>
</html>
