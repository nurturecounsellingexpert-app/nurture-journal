<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Journal — Nurture</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fff7e8;
}
.container{
  max-width:1200px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,.08);
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:24px;
}
h1{
  font-size:36px;
  margin:0 0 6px;
}
.subtitle{
  color:#999;
  margin-bottom:20px;
}
label{
  font-weight:600;
  margin-top:14px;
  display:block;
}
input, textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:0;
  margin-top:6px;
  background:#f3f3f3;
}
.good{background:#fde8b9;}
.todo{background:#d9efec;}
.tomorrow{background:#fde2a7;}
.note{min-height:100px;}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  padding:10px 14px;
  border-radius:20px;
  border:0;
  background:#2d7a78;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.secondary{
  background:#fff;
  color:#2d7a78;
  border:1px solid #cde;
}
.actions{
  margin-top:16px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.preview, .entries{
  background:#fafafa;
  padding:16px;
  border-radius:16px;
}
.preview h3, .entries h3{margin-top:0}
.preview div{
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
.p-affirm{background:#d9efec}
.p-good{background:#fde8b9}
.p-grateful{background:#f3efe6}
.p-todo{background:#d9efec}
.p-tomorrow{background:#fde2a7}
.entry{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}
.entry small{color:#888}
.entry-actions{
  margin-top:6px;
}
.entry-actions button{
  font-size:12px;
  padding:6px 10px;
}
.footer{
  font-size:12px;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div>
<h1>GRATITUDE <span style="font-size:18px;color:#999">journal</span></h1>
<div class="subtitle">You Matter — Daily reflection</div>

<label>Today's Affirmation</label>
<input id="affirm">

<label>3 Good Things Happened Today</label>
<input class="good" id="good1">
<input class="good" id="good2">
<input class="good" id="good3">

<label>3 Things You Are Grateful For</label>
<input id="gr1">
<input id="gr2">
<input id="gr3">

<div class="grid2">
<div>
<label>Things To Do</label>
<input class="todo" id="todo1">
<input class="todo" id="todo2">
<input class="todo" id="todo3">
</div>
<div>
<label>Tomorrow I Look Forward To</label>
<input class="tomorrow" id="tom1">
<input class="tomorrow" id="tom2">
<input class="tomorrow" id="tom3">
</div>
</div>

<label>Note / Reminder</label>
<textarea class="note" id="note"></textarea>

<div class="actions">
<button onclick="saveEntry()">Save Entry</button>
<button class="secondary" onclick="clearForm()">New</button>
<button class="secondary" onclick="exportJSON()">Export (.json)</button>
<button class="secondary" onclick="importJSON()">Import</button>
</div>

<div class="footer">
Your entries are stored only on this device. Nothing is uploaded or shared.
</div>
</div>

<!-- RIGHT -->
<div>
<div class="preview">
<h3>Preview</h3>
<div class="p-affirm" id="pAff"></div>
<div class="p-good" id="pGood"></div>
<div class="p-grateful" id="pGrat"></div>
<div class="p-todo" id="pTodo"></div>
<div class="p-tomorrow" id="pTom"></div>
</div>

<div class="entries">
<h3>Saved Entries</h3>
<div id="entries"></div>
<button class="secondary" onclick="clearAll()">Clear Local</button>
</div>
</div>

</div>

<script>
const dbName="journalDB";
let db;

function openDB(){
  return new Promise(res=>{
    const r=indexedDB.open(dbName,1);
    r.onupgradeneeded=e=>{
      e.target.result.createObjectStore("entries",{keyPath:"id"});
    };
    r.onsuccess=e=>{db=e.target.result;res();}
  })
}
openDB().then(loadEntries);

function getEntry(){
  return{
    id:Date.now(),
    time:new Date().toLocaleString(),
    affirmation:affirm.value,
    good:[good1.value,good2.value,good3.value],
    grateful:[gr1.value,gr2.value,gr3.value],
    todo:[todo1.value,todo2.value,todo3.value],
    tomorrow:[tom1.value,tom2.value,tom3.value],
    note:note.value
  }
}

function saveEntry(){
  const e=getEntry();
  const tx=db.transaction("entries","readwrite");
  tx.objectStore("entries").put(e);
  tx.oncomplete=loadEntries;
  clearForm();
}

function loadEntries(){
  entries.innerHTML="";
  const tx=db.transaction("entries");
  tx.objectStore("entries").openCursor(null,"prev").onsuccess=e=>{
    const c=e.target.result;
    if(!c)return;
    const d=c.value;
    entries.innerHTML+=`
      <div class="entry">
        <small>${d.time}</small>
        <div><b>Affirmation:</b> ${d.affirmation}</div>
        <div><b>Good:</b> ${d.good.filter(x=>x).join(", ")}</div>
        <div><b>Grateful:</b> ${d.grateful.filter(x=>x).join(", ")}</div>
        <div><b>To Do:</b> ${d.todo.filter(x=>x).join(", ")}</div>
        <div><b>Tomorrow:</b> ${d.tomorrow.filter(x=>x).join(", ")}</div>
        <div><b>Note:</b> ${d.note}</div>
        <div class="entry-actions">
          <button onclick="restore(${d.id})">Restore</button>
          <button onclick="del(${d.id})">Delete</button>
        </div>
      </div>`;
    c.continue();
  }
}

function restore(id){
  const tx=db.transaction("entries");
  tx.objectStore("entries").get(id).onsuccess=e=>{
    const d=e.target.result;
    affirm.value=d.affirmation;
    [good1.value,good2.value,good3.value]=d.good;
    [gr1.value,gr2.value,gr3.value]=d.grateful;
    [todo1.value,todo2.value,todo3.value]=d.todo;
    [tom1.value,tom2.value,tom3.value]=d.tomorrow;
    note.value=d.note;
  }
}
function del(id){
  const tx=db.transaction("entries","readwrite");
  tx.objectStore("entries").delete(id);
  tx.oncomplete=loadEntries;
}
function clearAll(){
  const tx=db.transaction("entries","readwrite");
  tx.objectStore("entries").clear();
  tx.oncomplete=loadEntries;
}
function clearForm(){
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
}

function exportJSON(){
  const tx=db.transaction("entries");
  tx.objectStore("entries").getAll().onsuccess=e=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(e.target.result,null,2)]));
    a.download="journal.json";
    a.click();
  }
}
function importJSON(){
  const i=document.createElement("input");
  i.type="file";
  i.onchange=()=>{
    const r=new FileReader();
    r.onload=()=>{
      const data=JSON.parse(r.result);
      const tx=db.transaction("entries","readwrite");
      data.forEach(d=>tx.objectStore("entries").put(d));
      tx.oncomplete=loadEntries;
    };
    r.readAsText(i.files[0]);
  };
  i.click();
}

/* LIVE PREVIEW */
["affirm","good1","good2","good3","gr1","todo1","tom1"].forEach(id=>{
  document.getElementById(id).addEventListener("input",updatePreview)
});
function updatePreview(){
  pAff.innerText="Affirmation — "+affirm.value;
  pGood.innerText="Good things — "+[good1.value,good2.value,good3.value].filter(x=>x).join(", ");
  pGrat.innerText="Grateful for — "+[gr1.value,gr2.value,gr3.value].filter(x=>x).join(", ");
  pTodo.innerText="Things To Do — "+[todo1.value,todo2.value,todo3.value].filter(x=>x).join(", ");
  pTom.innerText="Tomorrow — "+[tom1.value,tom2.value,tom3.value].filter(x=>x).join(", ");
}
</script>

</body>
</html>
