<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Journal</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Quicksand,system-ui;
  background:#fffaf0;
}

/* LOGIN */
#loginBox{
  max-width:340px;
  margin:100px auto;
  padding:24px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.12);
}
#loginBox input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ddd;
}
#loginBox button{
  width:100%;
  padding:12px;
  background:#2d7a78;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

/* JOURNAL */
#journal{display:none;}

.page{
  padding:36px 20px;
  display:flex;
  justify-content:center;
}

.sheet{
  background:white;
  max-width:980px;
  width:100%;
  padding:28px;
  border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.08);
}

.header{
  display:flex;
  gap:16px;
  margin-bottom:18px;
}
.title-main{
  font-family:'Playfair Display';
  font-size:52px;
  margin:0;
  color:#7f9a98;
  letter-spacing:4px;
}
.subtitle{
  color:#8aa3a0;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:20px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
}

.label{
  font-weight:700;
  color:#8aa3a0;
  margin-bottom:6px;
  display:block;
}

.pill{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  margin-bottom:8px;
  font-size:15px;
}
.blue{background:#d6eeeb;}
.warm{background:#fde6b8;}
.cream{background:#f3efe7;}

.note{
  min-height:90px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.btn{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  background:#2d7a78;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.ghost{
  background:transparent;
  border:1px solid #cfe3e1;
  color:#2d7a78;
}

.panel{
  background:#fff;
  padding:18px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}

.preview-pill{
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  font-size:14px;
}
.footer{
  font-size:13px;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>

  <form id="loginForm" method="POST"
    action="https://script.google.com/macros/s/AKfycbxJhvox0MOAJleXHS6jezMSmOyJztgMaI4yc1bazoe3bAAesFIlJ46D1UvDRzdce3G1/exec">

    <input type="hidden" name="action" value="login">
    <input type="hidden" name="passwordHash" id="passwordHash">

    <input name="username" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <p id="loginError" style="color:red"></p>
</div>

<!-- JOURNAL -->
<div id="journal">
<div class="page">
<div class="sheet">

  <div class="header">
    <div>
      <h1 class="title-main">GRATITUDE</h1>
      <div class="subtitle">You Matter — Daily reflection</div>
    </div>
  </div>

  <div class="grid">

    <!-- LEFT -->
    <div>
      <label class="label">Today's Affirmation</label>
      <input id="affirm" class="pill blue" placeholder="I am...">

      <label class="label">3 Good Things Happened Today</label>
      <input id="good1" class="pill warm">
      <input id="good2" class="pill warm">
      <input id="good3" class="pill warm">

      <label class="label">3 Things You Are Grateful For</label>
      <input id="gr1" class="pill cream">
      <input id="gr2" class="pill cream">
      <input id="gr3" class="pill cream">

      <label class="label">Things To Do</label>
      <input id="todo1" class="pill blue">
      <input id="todo2" class="pill blue">
      <input id="todo3" class="pill blue">

      <label class="label">Tomorrow I Look Forward To</label>
      <input id="tom1" class="pill warm">
      <input id="tom2" class="pill warm">
      <input id="tom3" class="pill warm">

      <label class="label">Note / Reminder</label>
      <textarea id="note" class="pill note"></textarea>

      <div class="actions">
        <button class="btn" id="saveBtn">Save Entry</button>
        <button class="ghost" id="newBtn">New</button>
      </div>

      <div class="footer">
        Entries are saved only on this device.
      </div>
    </div>

    <!-- RIGHT -->
    <aside class="panel">
      <strong>Preview</strong>
      <div id="pAff" class="preview-pill blue">Affirmation —</div>
      <div id="pGood" class="preview-pill warm">Good things —</div>
      <div id="pGr" class="preview-pill cream">Grateful for —</div>
      <div id="pTodo" class="preview-pill blue">Things To Do —</div>
      <div id="pTom" class="preview-pill warm">Tomorrow —</div>
    </aside>

  </div>
</div>
</div>
</div>

<script>
/* PASSWORD HASH */
loginForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const buf = new TextEncoder().encode(password.value);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  passwordHash.value = [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
  e.target.submit();
});

/* LOGIN RESULT */
const p = new URLSearchParams(location.search);
if(p.get("success")==="1"){
  loginBox.style.display="none";
  journal.style.display="block";
}
if(p.get("error")==="1"){
  loginError.textContent="Invalid login";
}

/* PREVIEW */
function updatePreview(){
  pAff.textContent="Affirmation — "+affirm.value;
  pGood.textContent="Good things — "+[good1,good2,good3].map(i=>i.value).filter(Boolean).join(" · ");
  pGr.textContent="Grateful for — "+[gr1,gr2,gr3].map(i=>i.value).filter(Boolean).join(" · ");
  pTodo.textContent="Things To Do — "+[todo1,todo2,todo3].map(i=>i.value).filter(Boolean).join(" · ");
  pTom.textContent="Tomorrow — "+[tom1,tom2,tom3].map(i=>i.value).filter(Boolean).join(" · ");
}

document.querySelectorAll("input,textarea").forEach(i=>i.addEventListener("input",updatePreview));

/* SAVE */
saveBtn.onclick=()=>{
  const entry={time:Date.now(),affirm:affirm.value};
  let all=JSON.parse(localStorage.getItem("entries")||"[]");
  all.unshift(entry);
  localStorage.setItem("entries",JSON.stringify(all));
  alert("Entry saved");
};

/* NEW */
newBtn.onclick=()=>{
  document.querySelectorAll("input,textarea").forEach(i=>i.value="");
  updatePreview();
};

updatePreview();
</script>

</body>
</html>
